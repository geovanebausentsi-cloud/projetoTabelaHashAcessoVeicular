<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Veículo - Prefeitura</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <div style="font-weight: bold; font-size: 1.2rem; color: var(--primary-color);">
            🚗 Controlo de Acesso
        </div>
        <nav>
            <a href="cadastro.html">Cadastro</a>
            <a href="index.html">Busca</a>
        </nav>
    </header>

    <main>
        <div class="container-card">
            <h2>📝 Novo Cadastro</h2>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">
                Preencha os dados abaixo para autorizar um veículo.
            </p>

            <form id="formCadastro">
                <div style="text-align: left;">
                    <label for="placa">Placa do Veículo</label>
                    <input type="text" id="placa" name="placa" required placeholder="Ex: ABC1D34">
                </div>

                <div style="text-align: left; margin-top: 10px;">
                    <label for="proprietario">Nome do Proprietário</label>
                    <input type="text" id="proprietario" name="proprietario" required placeholder="Nome completo">
                </div>

                <div style="text-align: left; margin-top: 10px;">
                    <label for="modelo">Modelo do Carro</label>
                    <input type="text" id="modelo" name="modelo" required placeholder="Ex: Fiat Uno">
                </div>

                <button type="submit">Cadastrar Veículo</button>
            </form>

            <div class="saidaDeCadastro" id="saidaCadastro"></div>
        </div>
    </main>

    <footer>
        &copy; 2025 Prefeitura Municipal - Sistema de Controlo
    </footer>

    <script type="module" src="../main.js"></script>
</body>

</html>
